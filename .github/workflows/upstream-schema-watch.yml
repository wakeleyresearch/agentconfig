name: Upstream Schema & Release Watch

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-schema-watch
  cancel-in-progress: false

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check upstream schemas and release feeds (fail-closed)
        id: watch
        shell: bash
        run: |
          set -euo pipefail
          REPORT_FILE="${RUNNER_TEMP}/upstream-drift-report.md"
          OUTPUT_DELIM="EOF_$(openssl rand -hex 16)"
          export OUTPUT_DELIM

          python3 - "$REPORT_FILE" <<'PYEOF'
          import hashlib
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from pathlib import Path

          report_path = Path(sys.argv[1])
          sources_doc = json.loads(Path("policy/upstream-sources.json").read_text(encoding="utf-8"))
          sources = sources_doc.get("sources", {})
          if not isinstance(sources, dict) or not sources:
              print("ERROR: policy/upstream-sources.json has no sources", file=sys.stderr)
              sys.exit(2)

          drifts = []
          fetch_errors = []

          for source_id, meta in sorted(sources.items()):
              url = meta["url"]
              kind = meta["kind"]
              harness = meta["harness"]
              expected = meta.get("sha256")
              snapshot_rel = meta.get("snapshot_file")

              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "agentconfig-upstream-watch/1.0 (+https://github.com/wakeleyresearch/agentconfig)",
                      "Accept": "application/json, application/atom+xml, text/markdown, text/html;q=0.9, */*;q=0.8",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      status = getattr(resp, "status", 200)
                      if status < 200 or status >= 300:
                          fetch_errors.append(f"{source_id} ({url}): HTTP {status}")
                          continue
                      data = resp.read()
              except (urllib.error.URLError, TimeoutError, OSError) as exc:
                  fetch_errors.append(f"{source_id} ({url}): {exc}")
                  continue

              if not data:
                  fetch_errors.append(f"{source_id} ({url}): empty response body")
                  continue

              key_delta = ""
              if kind == "json_schema":
                  try:
                      live_obj = json.loads(data.decode("utf-8"))
                  except Exception as exc:
                      fetch_errors.append(f"{source_id} ({url}): invalid JSON schema ({exc})")
                      continue
                  if snapshot_rel and Path(snapshot_rel).exists():
                      snap_obj = json.loads(Path(snapshot_rel).read_text(encoding="utf-8"))
                      live_props = set((live_obj.get("properties") or {}).keys())
                      snap_props = set((snap_obj.get("properties") or {}).keys())
                      added = sorted(live_props - snap_props)
                      removed = sorted(snap_props - live_props)
                      if added or removed:
                          key_delta = f"added_keys={added[:15]}, removed_keys={removed[:15]}"

              actual = hashlib.sha256(data).hexdigest()
              if actual != expected:
                  drifts.append({
                      "id": source_id,
                      "harness": harness,
                      "kind": kind,
                      "url": url,
                      "expected": expected,
                      "actual": actual,
                      "snapshot_file": snapshot_rel,
                      "key_delta": key_delta,
                  })

          if fetch_errors:
              summary = ["### Upstream Fetch Error (Fail-Closed)", ""]
              for err in fetch_errors:
                  summary.append(f"- {err}")
                  print(f"FAIL-CLOSED: {err}", file=sys.stderr)
              step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if step_summary:
                  with open(step_summary, "a", encoding="utf-8") as fh:
                      fh.write("\n".join(summary) + "\n")
              sys.exit(1)

          if drifts:
              lines = [
                  "### Upstream Schema / Release Drift Detected",
                  "",
                  "| Source ID | Harness | Kind | Expected SHA-256 | Actual SHA-256 | Details |",
                  "| :--- | :--- | :--- | :--- | :--- | :--- |",
              ]
              for d in drifts:
                  exp_short = (d["expected"] or "none")[:12]
                  act_short = d["actual"][:12]
                  detail = d["key_delta"] or f"`{d['snapshot_file'] or d['url']}`"
                  lines.append(
                      f"| `{d['id']}` | `{d['harness']}` | `{d['kind']}` | `{exp_short}` | `{act_short}` | {detail} |"
                  )
              lines.extend([
                  "",
                  "Review upstream schema deltas before updating `policy/upstream-schemas/` and `policy/upstream-sources.json` via `bin/agentcfg upstream-check --update-baseline`.",
              ])
              report_text = "\n".join(lines) + "\n"
              drift_flag = "true"
          else:
              report_text = "No upstream schema or release drift detected.\n"
              drift_flag = "false"

          report_path.write_text(report_text, encoding="utf-8")
          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a", encoding="utf-8") as fh:
                  fh.write(report_text)

          delim = os.environ["OUTPUT_DELIM"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as gh_out:
              gh_out.write(f"drift_detected={drift_flag}\n")
              gh_out.write(f"report<<{delim}\n")
              gh_out.write(report_text)
              gh_out.write(f"{delim}\n")
          PYEOF

      - name: Create or update deduplicated drift issue
        if: steps.watch.outputs.drift_detected == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DRIFT_REPORT: ${{ steps.watch.outputs.report }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const labelName = 'upstream-drift';
            const issueTitle = '[upstream-watch] Upstream schema & release drift detected';
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = `${process.env.DRIFT_REPORT}\n---\nWorkflow run: ${runUrl}\n`;

            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: labelName,
                color: 'd93f0b',
                description: 'Automated upstream schema or harness release drift alert',
              });
            } catch (err) {
              if (err.status !== 422) {
                throw err;
              }
            }

            const existing = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: labelName,
              per_page: 20,
            });
            const match = existing.data.find((i) => !i.pull_request);
            if (match) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: match.number,
                title: issueTitle,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: issueTitle,
                body,
                labels: [labelName],
              });
            }
